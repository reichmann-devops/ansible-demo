---
- name: Example playbook using git and copy modules
  hosts: "{{ target_hosts | default('all') }}"
  become: false
  gather_facts: false

  tasks:
    - name: Clone repo to local host
      ansible.builtin.git:
        repo: https://gitlab.com/reichmann-devops/ansible-demo.git
        dest: /tmp/demo
        single_branch: true
        version: main
        accept_newhostkey: true
      delegate_to: localhost

    - name: Copy file to remote host
      ansible.builtin.copy:
        src: /tmp/demo/simple_script.sh
        dest: /tmp/
        mode: '0655'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Run simple script on remote host
      ansible.builtin.command:
        cmd: bash /tmp/simple_script.sh
      register: script_output
      changed_when: false

    - name: Debugging output from script
      ansible.builtin.debug:
        var: script_output

    - name: Remove files from remote host
      ansible.builtin.file:
        path: /tmp/demo
        state: absent

    - name: Remove files from local host
      ansible.builtin.file:
        path: /tmp/demo
        state: absent
      delegate_to: localhost
